<script>
const Q=[{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Spending too long on short, low-quality videos can lead to what many young people call “brain ______”.","o":["rot","rotten","decay","waste"],"a":0,"e":"brain rot = tình trạng “thối não” do lướt nội dung kém chất lượng (Đề Khánh Hòa)."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Everything you post online adds to your digital ______, which employers may check years later.","o":["fingerprint","shadow","signature","footprint"],"a":3,"e":"digital footprint = dấu vết số."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Her short video was shared by millions overnight and turned into ______.","o":["an algorithm","a press release","viral content","an editorial"],"a":2,"e":"viral content = nội dung lan truyền nhanh."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"It was a ______ decision; he ignored the long-term consequences.","o":["sight-short","short-sighted","short-sight","shorts-sighted"],"a":1,"e":"short-sighted (adj ghép) = thiển cận."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"She was ______ when her best friend moved abroad and could hardly speak.","o":["heart-broken","broken-heart","heart-breaking","heart-break"],"a":0,"e":"heart-broken = đau lòng (adj mang nghĩa bị động)."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The teacher prefers a ______ approach, in which students tackle real situations.","o":["solving-problem","problem-solved","problems-solving","problem-solving"],"a":3,"e":"problem-solving approach = cách tiếp cận giải quyết vấn đề."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The clinic has just bought a ______ scanner.","o":["states-of-art","the-state-of-art","state-of-the-art","state-of-arts"],"a":2,"e":"state-of-the-art = hiện đại nhất (adj ghép cố định)."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The match was postponed ______ the heavy storm.","o":["in spite of","on account of","in contrast to","as opposed to"],"a":1,"e":"on account of = vì, do."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The council banned cars from the centre ______ reducing pollution.","o":["with a view to","in lieu of","by virtue of","in place of"],"a":0,"e":"with a view to + V-ing = nhằm mục đích."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"He accepted extra holiday ______ a pay rise.","o":["on behalf of","in terms of","in favour of","in lieu of"],"a":3,"e":"in lieu of = thay cho."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"In ______ fire, use the stairs, not the lift.","o":["spite of","view of","case of","place of"],"a":2,"e":"in case of + N = trong trường hợp (có)."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"She tried to ______ the tension in the room by cracking a joke.","o":["break up","ease","put through","call off"],"a":1,"e":"ease the tension = làm dịu căng thẳng."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Prices were so high that many families had to ______ travel last year.","o":["cut back on","cut off","cut in","cut across"],"a":0,"e":"cut back on = cắt giảm."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The two brothers have been at ______ ever since their father’s will was read.","o":["a loss","ease","large","loggerheads"],"a":3,"e":"at loggerheads = bất hòa gay gắt."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The two rivals have been at daggers ______ for years.","o":["pulled","raised","drawn","held"],"a":2,"e":"at daggers drawn = thù địch công khai."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"We ______ reject any claim that the results were faked.","o":["narrowly","categorically","allegedly","distinctly"],"a":1,"e":"categorically reject = bác bỏ hoàn toàn."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"She became one of the most ______ writers of her generation, publishing over fifty novels.","o":["prolific","fertile","profligate","fruitful"],"a":0,"e":"prolific = sáng tác nhiều."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The whole project is based on the ______ that people prefer convenience to price.","o":["base","ground","law","premise"],"a":3,"e":"work/act on the premise that = dựa trên tiền đề rằng."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Many parents ______ the pressure that social media puts on teenagers.","o":["persuade","convince","underestimate","discourage"],"a":2,"e":"underestimate = đánh giá thấp."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Rare bonsai trees can ______ very high prices on the market.","o":["obtain","command","expect","afford"],"a":1,"e":"command a high price = bán được giá cao (chủ ngữ là vật)."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Valuable objects naturally attract the ______ of thieves.","o":["attention","intention","petition","location"],"a":0,"e":"attract attention = thu hút sự chú ý."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"After the burglary, he decided to ______ the possibility of tagging his trees electronically.","o":["go after","try out","set about","look into"],"a":3,"e":"look into = xem xét, điều tra."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The microchip is no bigger than a ______ of rice.","o":["crumb","speck","grain","bean"],"a":2,"e":"a grain of rice = hạt gạo."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Tagging doesn’t ______ thieves from stealing; it only helps owners recover the goods.","o":["avoid","prevent","decide","combine"],"a":1,"e":"prevent sb from V-ing = ngăn ai làm gì."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Traditional training models often suffer ______ content mismatches.","o":["from","of","with","by"],"a":0,"e":"suffer from = chịu đựng."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Peer-led labs help to ______ the soft-skill gap between school and work.","o":["bind","bury","bend","bridge"],"a":3,"e":"bridge the gap = thu hẹp khoảng cách."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Expecting schools to fix this without changing is putting the cart before the ______.","o":["wagon","driver","horse","wheel"],"a":2,"e":"put the cart before the horse = làm ngược thứ tự."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Low-cost training is the key to economic integration in the long ______.","o":["road","run","hand","day"],"a":1,"e":"in the long run = về lâu dài."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Guests are encouraged to ______ the quiet atmosphere and notice subtle gestures.","o":["appreciate","flatter","undermine","celebrate"],"a":0,"e":"appreciate = trân trọng, thưởng thức."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"In the tea ceremony, silence is not awkward but ______ valued.","o":["utterly","firmly","strongly","highly"],"a":3,"e":"highly valued = được đánh giá cao."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Visitors are expected to ______ themselves in the local culture.","o":["attend","embody","immerse","flatter"],"a":2,"e":"immerse oneself in = đắm mình vào."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The arrangement of the room can have a significant ______ on the guest’s mood.","o":["consequence","impact","improvement","limitation"],"a":1,"e":"have an impact on = tác động đến."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Many international hotels now ______ elements of this approach.","o":["adopt","reject","abandon","resist"],"a":0,"e":"adopt = áp dụng."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Good manners are now ______ to our staff-training programme.","o":["redundant","external","minor","integral"],"a":3,"e":"integral to = không thể thiếu đối với."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"After the trip, tourists become more ______ of small details that are usually ignored.","o":["reflected","imposed","aware","relied"],"a":2,"e":"aware of = nhận thức được."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Changes in climate can ______ the delicate balance between predators and prey.","o":["manage","disturb","sustain","redress"],"a":1,"e":"disturb the balance = phá vỡ sự cân bằng."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"For mountain-climbing, a really good sleeping bag is ______.","o":["indispensable","attainable","verifiable","undeniable"],"a":0,"e":"indispensable = không thể thiếu."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The old castle ______ a commanding position at the top of the hill.","o":["indicates","illustrates","determines","occupies"],"a":3,"e":"occupy a position = chiếm một vị trí."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The use of robots has ______ many boring, low-paid factory jobs.","o":["put down for","passed on to","done away with","made up for"],"a":2,"e":"do away with = loại bỏ."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The government says the economy is improving, but this survey suggests ______.","o":["nonetheless","otherwise","certainly","seriously"],"a":1,"e":"suggest otherwise = gợi ý điều ngược lại."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"It is common knowledge that exams are held under strict time ______.","o":["constraints","signals","boundaries","processes"],"a":0,"e":"time constraints = giới hạn thời gian."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"When treating any illness, doctors always consider the ______ causes.","o":["deserving","worthwhile","sufficient","underlying"],"a":3,"e":"underlying causes = nguyên nhân sâu xa."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"Only citizens aged 18 or over are ______ to vote.","o":["admissible","respectable","eligible","reasonable"],"a":2,"e":"eligible to V = đủ điều kiện."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The hospital’s equipment is a bit ______, which lowers the quality of treatment.","o":["ahead of its time","behind the times","high and low","like nothing on earth"],"a":1,"e":"behind the times = lạc hậu."},{"s":"TỪ VỰNG, COLLOCATION & THÀNH NGỮ","q":"The minister ______ plans for a new law to protect disadvantaged children.","o":["unveiled","disrupted","reflected","addressed"],"a":0,"e":"unveil plans = công bố kế hoạch."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"They didn’t recognise the singer in dark glasses, ______?","o":["didn’t they","did he","didn’t he","did they"],"a":3,"e":"Câu phủ định → tag khẳng định; chủ ngữ they."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"We’d rather you ______ so much about the new rules.","o":["don’t complain","not to complain","didn’t complain","won’t complain"],"a":2,"e":"would rather + S + V quá khứ (hiện tại/tương lai)."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Her accent is very different ______ mine.","o":["of","from","with","on"],"a":1,"e":"different from."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Larry drove all night. He ______ exhausted by the time he arrived.","o":["must have been","ought to have been","should have been","could have been"],"a":0,"e":"must have P2 = suy đoán chắc chắn về quá khứ."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"______ successfully last year, the satellite has since sent back useful data.","o":["Launching","To launch","Having launch","Launched"],"a":3,"e":"Rút gọn mệnh đề bị động bằng P2."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"______ surprised everyone was how quickly the students finished the app.","o":["That","It","What","Which"],"a":2,"e":"Câu chẻ giả (pseudo-cleft): What + V + be + ..."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Designed by a young architect, ______.","o":["thousands of visitors are attracted to the library","the library attracts thousands of visitors","the architect’s design attracts the library","visitors attract the library"],"a":1,"e":"Chủ ngữ của mệnh đề chính phải là vật được thiết kế (the library)."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Having been degraded by years of pollution, ______.","o":["the river is now the focus of a clean-up programme","a clean-up programme now focuses on the river","focus is now on the river by a programme","a programme of the river is now focused"],"a":0,"e":"Dangling participle: chủ ngữ phải là the river."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"It is imperative that every engine ______ checked before take-off.","o":["is","were","has been","be"],"a":3,"e":"Giả định cách (subjunctive) sau imperative: that + S + V nguyên mẫu."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"The park covers about eighty acres, ______.","o":["is five times the area of the stadium","the area of the stadium five times","five times the area of the stadium","the area of five times the stadium"],"a":2,"e":"Cụm đồng vị (apposition), không thêm động từ."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"______ fringe benefits, such as a company car, I would have applied for the post.","o":["Should the company offer","Had the company offered","If the company didn’t offer","Were the company to offer"],"a":1,"e":"Điều kiện loại 3 đảo ngữ: Had + S + P2."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"But for your advice, I ______ the wrong course.","o":["would have chosen","would choose","will have chosen","had chosen"],"a":0,"e":"But for = if it hadn’t been for → would have P2."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"I would rather ______ my holiday at the seaside this year.","o":["to spend","spent","spending","spend"],"a":3,"e":"would rather + V nguyên mẫu (cùng chủ ngữ)."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"______ a lovely evening we had by the lake!","o":["How","Such","What","So"],"a":2,"e":"What a + adj + N! (câu cảm thán)."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"The more carefully you check your work, ______ mistakes you will make.","o":["fewer","the fewer","the less","as fewer"],"a":1,"e":"So sánh kép: the more..., the fewer + N đếm được."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"The athlete is reported ______ intensive training before the final.","o":["to have completed","to complete","completing","having completed"],"a":0,"e":"be reported + to have P2 (hành động xảy ra trước)."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"______ he needs most is a good night’s sleep.","o":["That","Whether","Why","What"],"a":3,"e":"What = the thing that (chủ ngữ của mệnh đề)."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"They adopted a ______ dog from the shelter.","o":["brown little lovely","little lovely brown","lovely little brown","lovely brown little"],"a":2,"e":"OSASCOMP: opinion – size – colour."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Nobody has called yet, ______?","o":["has he","have they","hasn’t he","haven’t they"],"a":1,"e":"Nobody → tag dùng they, khẳng định."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Neither the manager nor the employees ______ aware of the problem.","o":["were","was","is","be"],"a":0,"e":"Neither…nor: động từ hòa hợp với danh từ gần nhất (employees)."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Many a student ______ nervous before an important exam.","o":["feel","are feeling","have felt","feels"],"a":3,"e":"Many a + N số ít + V số ít."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Never ______ to such an unreasonable demand.","o":["Jane would agree","Jane agrees","would Jane agree","did Jane agrees"],"a":2,"e":"Đảo ngữ sau trạng từ phủ định."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Not until the lights went out ______ the noise.","o":["she noticed","did she notice","noticed she","she did notice"],"a":1,"e":"Not until + mệnh đề + trợ động từ + S + V."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Only after trying every method ______ her sister for advice.","o":["did she call","she called","called she","she did call"],"a":0,"e":"Only after + V-ing + đảo ngữ."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Seldom ______ so much pressure on teenagers as today.","o":["there has been","there was","was there been","has there been"],"a":3,"e":"Seldom + đảo ngữ (thì hiện tại hoàn thành)."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Such was the speed of the expansion ______ the firm opened new offices abroad.","o":["which","as","that","when"],"a":2,"e":"Such + be + N + that-clause."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"In spite of ______ very little experience, she solved the problem effectively.","o":["have","having","to have","had"],"a":1,"e":"In spite of + V-ing."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"______ the coach had little experience, the team improved quickly.","o":["Although","Despite","In spite","However"],"a":0,"e":"Although + mệnh đề."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"If it ______ for the generous salary, he wouldn’t have taken the job.","o":["wasn’t","weren’t","hasn’t been","hadn’t been"],"a":3,"e":"If it hadn’t been for = nếu không nhờ/vì."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"It is widely believed that modern technology ______ the way we communicate.","o":["have changed","are changing","has changed","change"],"a":2,"e":"Technology (số ít) → has changed."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Teenagers spend a great ______ of time online.","o":["number","amount","many","few"],"a":1,"e":"a great amount of + N không đếm được."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Technology allows people ______ connected more easily.","o":["to stay","staying","stay","stayed"],"a":0,"e":"allow sb to V."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Many parents worry that their children depend too much on electronic ______.","o":["device","devise","devised","devices"],"a":3,"e":"Electronic devices (số nhiều)."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"Social media is believed ______ the way teenagers communicate over the last decade.","o":["to change","changing","to have changed","having changed"],"a":2,"e":"be believed + to have P2."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"The school ______ so many computers; half of them are never used.","o":["mustn’t have bought","needn’t have bought","needn’t buy","shouldn’t to buy"],"a":1,"e":"needn’t have P2 = đã làm điều không cần thiết."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"She appears ______ responsible for organising the charity event.","o":["to be","being","that","be"],"a":0,"e":"appear + to V."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"The corporation ______ the warnings about pollution; now it faces a heavy fine.","o":["shouldn’t ignore","mustn’t have ignored","shouldn’t have been ignoring","shouldn’t have ignored"],"a":3,"e":"shouldn’t have P2 = chỉ trích hành động quá khứ."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"______ the community decides, I will support it.","o":["Whenever","However","Whatever","Wherever"],"a":2,"e":"Whatever + S + V = bất cứ điều gì."},{"s":"NGỮ PHÁP & CẤU TRÚC","q":"They will carry on regardless of ______ little financial support
